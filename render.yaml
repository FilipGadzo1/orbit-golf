# One-service deployment: a single Node process serves the built client AND the
# multiplayer WebSocket server from the same origin. Connect this repo at
# https://dashboard.render.com → New → Blueprint, and Render reads this file.
services:
  - type: web
    name: orbit-golf
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
